<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140" role="img" aria-label="Consecutive samples of A with the set A, B form a run, and so do those of B, a little longer; the two runs lie on top of each other, so they become one edge, whose centerline is the longest run, B's.">
