<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140" role="img" aria-label="Top: a wobbly centerline is simplified, dropping every point within 0.5 meters of the straighter line kept. Bottom: three edges numbered 1, 2 and 3 meet at a node; route A's walk is edge 1, then edge 2.">
<title>Top: a wobbly centerline is simplified, dropping every point within 0.5 meters of the straighter line kept. Bottom: three edges numbered 1, 2 and 3 meet at a node; route A's walk is edge 1, then edge 2.</title>
<style>
svg { --surface: #ffffff; --ink: #17212b; --muted: #546171; --rule: #d6dde6; --code-bg: #e9eef4; --accent: #0a6a91; --accent-soft: #dcecf4; --bar: #17212b; --r-red: #d22b3f; --r-blue: #1d62c6; --r-green: #108a55; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
@media (prefers-color-scheme: dark) { svg { --surface: #0d1117; --ink: #e4e9ef; --muted: #9aa7b5; --rule: #2b3541; --code-bg: #1d2630; --accent: #5db8e2; --accent-soft: #15303f; --bar: #e4e9ef; --r-red: #ff6074; --r-blue: #66a1ff; --r-green: #3fcb8c; } }
.ln { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
