<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="240" height="140" role="img" aria-label="Three edges end close to each other at a junction, their ends under 5 meters apart. They join into one node placed at the average of the three ends.">
<title>Three edges end close to each other at a junction, their ends under 5 meters apart. They join into one node placed at the average of the three ends.</title>
<style>
svg { --surface: #ffffff; --ink: #17212b; --muted: #546171; --rule: #d6dde6; --code-bg: #e9eef4; --accent: #0a6a91; --accent-soft: #dcecf4; --bar: #17212b; --r-red: #d22b3f; --r-blue: #1d62c6; --r-green: #108a55; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
@media (prefers-color-scheme: dark) { svg { --surface: #0d1117; --ink: #e4e9ef; --muted: #9aa7b5; --rule: #2b3541; --code-bg: #1d2630; --accent: #5db8e2; --accent-soft: #15303f; --bar: #e4e9ef; --r-red: #ff6074; --r-blue: #66a1ff; --r-green: #3fcb8c; } }
.ln { fill: none; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
.ln.thin { stroke-width: 2.5; } .ln.mid { stroke-width: 4.5; }
.ra { stroke: var(--r-red); } .rb { stroke: var(--r-blue); } .rc { stroke: var(--r-green); }
.fa { fill: var(--r-red); } .fb { fill: var(--r-blue); } .fc { fill: var(--r-green); }
.bar { fill: var(--bar); stroke: var(--surface); stroke-width: 2; }
.edge { fill: none; stroke: var(--muted); stroke-width: 3; stroke-linecap: round; }
.edge.dash { stroke-dasharray: 4 4; stroke-width: 2; }
.node { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.t-sub { fill: var(--muted); font-size: 11.5px; } .t-note { fill: var(--muted); font-size: 12px; }
.t-lab { fill: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
.t-accent { fill: var(--accent); font-weight: 700; font-size: 12px; }
.flow { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.flow.hot { stroke: var(--accent); stroke-width: 2.2; }
.flow.link { stroke: var(--accent); stroke-dasharray: 2 3; stroke-width: 1.4; }
.head { fill: var(--ink); } .head.hot { fill: var(--accent); }
.pt { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; } .pt.hot { fill: var(--accent); stroke: var(--accent); }
.stp { fill: var(--surface); stroke: var(--ink); stroke-width: 2; }
.dot { fill: var(--ink); } .dot.mut { fill: var(--muted); }
.gone { stroke-dasharray: 1 5; }
.near { fill: var(--code-bg); }
.cell { fill: none; stroke: var(--rule); stroke-width: 1; }
.zone { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 3 3; }
.ring { fill: none; stroke: var(--accent); stroke-width: 2; }
.guide { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.frontln { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 3 2; }
.tol { fill: none; stroke: var(--accent-soft); stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
</style>
<circle class="zone" cx="118" cy="76" r="18"/>
<path class="edge" d="M 10 74 L 104 74"/>
<path class="edge" d="M 230 22 L 128 66"/>
<path class="edge" d="M 196 134 L 122 88"/>
<path class="guide" d="M 104 74 L 118 76 M 128 66 L 118 76 M 122 88 L 118 76"/>
<circle class="dot" cx="104" cy="74" r="2.6"/>
<circle class="dot" cx="128" cy="66" r="2.6"/>
<circle class="dot" cx="122" cy="88" r="2.6"/>
<circle class="node" cx="118" cy="76" r="4.5"/>
<text x="10" y="40" class="t-lab">edge ends</text>
<text x="10" y="54" class="t-lab">&lt; 5 m apart</text>
<text x="10" y="112" class="t-note">one node at</text>
<text x="10" y="126" class="t-note">their average</text>
</svg>
