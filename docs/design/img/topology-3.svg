<circle class="pt" cx="90" cy="70" r="3.5"/>
<text x="220" y="74" class="t-lab">A</text>
<text x="220" y="92" class="t-lab">B</text>
<text x="60" y="14" class="t-lab">C</text>
<text x="146" y="46" class="t-accent">key {A, B}</text>
<text x="146" y="108" class="t-note">B: parallel, in</text>
<text x="126" y="132" class="t-note">C: over 30°, out</text>
