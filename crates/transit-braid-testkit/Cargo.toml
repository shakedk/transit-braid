[package]
name = "transit-braid-testkit"
description = "Test tooling for transit-braid: loads and validates the fixtures, golden digests, quality rules and topology checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
transit-braid-core = { path = "../transit-braid-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
proptest = "1"

# Test tooling, never shipped: the workspace's base lints without its strict production set (a
# check may stop on bad test data), and platform math allowed (its ban is for the shipped code's
# determinism; these checks measure that code's output, they don't produce it).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
float_cmp = "warn"
disallowed_methods = "allow"
