<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>transit-braid demo</title>
    <style>
      html,
      body,
      #map {
        margin: 0;
        height: 100%;
      }
      #info {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgb(255 255 255 / 0.92);
        font:
          13px/1.4 system-ui,
          sans-serif;
        box-shadow: 0 1px 4px rgb(0 0 0 / 0.2);
      }
      #info button {
        font: inherit;
        cursor: pointer;
      }
      #routes {
        list-style: none;
        margin: 6px 0;
        padding: 0;
      }
      #routes li {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 2px 0;
      }
      .swatch {
        display: inline-block;
        width: 14px;
        height: 6px;
        border-radius: 2px;
      }
      .pick[aria-pressed='true'] {
        font-weight: 700;
        outline: 2px solid #333;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="info">
      <strong>transit-braid</strong> · demo<br />
      Routes drawn side by side by <code>sideBySide()</code> (Rust in WebAssembly, in a Web Worker).
      Every edit draws them again.<br />
      <label><input type="checkbox" id="side-by-side" checked /> Side by side</label><br />
      <span id="status">Loading…</span>
      <ul id="routes" aria-label="Routes"></ul>
      <small>Click a route's name, then drag its points to move it.</small><br />
      <button id="add" type="button" disabled>Add route</button>
      <button id="finish" type="button" hidden>Finish</button>
      <button id="cancel" type="button" hidden>Cancel</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
